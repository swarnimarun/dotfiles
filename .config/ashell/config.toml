log_level = "warn"
position = "Top"
enable_esc_key = true

[modules]
left = [ "Workspaces" ]
center = [ "WindowTitle" ]
right = [ [ "Tray", "WifiShort", "VolumePercent", "DateTime", "Settings" ] ]

[workspaces]
enable_workspace_filling = true
visibility_mode = "MonitorSpecific"

[window_title]
truncate_title_after_length = 90

[clock]
format = "%a %b %d %R"

[settings]
lock_cmd = "hyprlock &"
audio_sinks_more_cmd = "pavucontrol -t 3"
audio_sources_more_cmd = "pavucontrol -t 4"
wifi_more_cmd = 'if command -v nm-connection-editor >/dev/null 2>&1; then nm-connection-editor; elif command -v nmtui >/dev/null 2>&1; then alacritty -e nmtui; fi'
vpn_more_cmd = 'if command -v nm-connection-editor >/dev/null 2>&1; then nm-connection-editor; elif command -v nmtui >/dev/null 2>&1; then alacritty -e nmtui; fi'
bluetooth_more_cmd = "blueberry"
remove_airplane_btn = true
remove_idle_btn = true
indicators = [ "Audio", "Bluetooth", "Battery", "Vpn" ]

[[CustomModule]]
name = "VolumePercent"
icon = "󰕾"
command = "pavucontrol -t 3"
listen_cmd = "bash /home/swarnim/.config/ashell/scripts/volume-listen.sh"
icons.'^muted$' = "󰝟"
icons.'^low$' = "󰕿"
icons.'^mid$' = "󰖀"
icons.'^high$' = "󰕾"

[[CustomModule]]
name = "WifiShort"
icon = "󰖩"
command = 'if command -v nm-connection-editor >/dev/null 2>&1; then nm-connection-editor; elif command -v nmtui >/dev/null 2>&1; then alacritty -e nmtui; fi'
listen_cmd = "bash /home/swarnim/.config/ashell/scripts/wifi-short-listen.sh"
icons.'^wifi$' = "󰖩"
icons.'^wired$' = "󰈀"
icons.'^offline$' = "󰖪"

[[CustomModule]]
name = "DateTime"
icon = " "
command = 'if command -v zenity >/dev/null 2>&1; then zenity --calendar --title="Calendar"; elif command -v gsimplecal >/dev/null 2>&1; then gsimplecal; else alacritty -e bash -lc "cal -3; echo; date; read -n 1 -s -r -p \"Press any key to close\""; fi'
listen_cmd = "bash /home/swarnim/.config/ashell/scripts/datetime-listen.sh"

[appearance]
style = "Solid"
opacity = 0.94
scale_factor = 1.08
success_color = "#8ad493"
text_color = "#d8dce3"
workspace_colors = [ "#7fb2ff", "#8ad493", "#9dc0ff" ]
special_workspace_colors = [ "#7fb2ff", "#8ad493", "#9dc0ff" ]

[appearance.primary_color]
base = "#7fb2ff"
text = "#0e1116"

[appearance.danger_color]
base = "#ff6f7d"
weak = "#ffc36f"

[appearance.background_color]
base = "#101317"
weak = "#1a1f25"
strong = "#252c35"

[appearance.secondary_color]
base = "#0a0d11"
strong = "#151b22"

[appearance.menu]
opacity = 0.96
backdrop = 0.35
