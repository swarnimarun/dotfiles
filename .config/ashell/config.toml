log_level = "warn"
position = "Top"
layer = "Top"
enable_esc_key = true
outputs = "All"

[modules]
left = [ [ "AppLauncher", "Workspaces" ] ]
center = [ "WindowTitle" ]
right = [ "MediaPlayer", [ "Tray", "Privacy", "Notifications", "Tempo", "Settings" ] ]

[workspaces]
enable_workspace_filling = true
visibility_mode = "MonitorSpecific"
group_by_monitor = true
max_workspaces = 6
disable_special_workspaces = true
workspace_names = [ "1", "2", "3", "4", "5", "6" ]

[window_title]
truncate_title_after_length = 72
mode = "Title"

[[CustomModule]]
name = "AppLauncher"
type = "Button"
icon = "󱗼"
command = "vicinae open"

[tempo]
clock_format = "%a %d %b %R"
formats = [
  "%a %d %b %R",
  "%H:%M:%S",
  "%Y-%m-%d",
]
timezones = [ "Asia/Kolkata", "UTC", "America/Los_Angeles" ]
weather_location = { City = "Lucknow" }
weather_indicator = "None"

[media_player]
max_title_length = 42
indicator_format = "Icon"

[notifications]
format = "%H:%M"
show_timestamps = true
show_bodies = false
grouped = true
toast = true
toast_position = "top_right"
toast_timeout = 3500
toast_limit = 3
toast_max_height = 130
blocklist = [ "^blueman$", "^nm-connection-editor$" ]

[updates]
check_cmd = 'bash -lc "checkupdates 2>/dev/null || true; if command -v paru >/dev/null; then paru -Qua; elif command -v yay >/dev/null; then yay -Qua; fi"'
update_cmd = 'wezterm-gui start --always-new-process -- bash -lc "if command -v paru >/dev/null; then paru -Syu; elif command -v yay >/dev/null; then yay -Syu; else sudo pacman -Syu; fi; echo; read -n 1 -s -r -p \"Done - press any key\""'
interval = 3600

[settings]
lock_cmd = "hyprlock &"
audio_sinks_more_cmd = "pavucontrol -t 3"
audio_sources_more_cmd = "pavucontrol -t 4"
wifi_more_cmd = 'if command -v nm-connection-editor >/dev/null 2>&1; then nm-connection-editor; elif command -v nmtui >/dev/null 2>&1; then wezterm-gui start -- nmtui; fi'
vpn_more_cmd = 'if command -v nm-connection-editor >/dev/null 2>&1; then nm-connection-editor; elif command -v nmtui >/dev/null 2>&1; then wezterm-gui start -- nmtui; fi'
bluetooth_more_cmd = 'if command -v blueman-manager >/dev/null 2>&1; then blueman-manager; elif command -v blueberry >/dev/null 2>&1; then blueberry; fi'
shutdown_cmd = "systemctl poweroff"
suspend_cmd = "systemctl suspend"
hibernate_cmd = ""
reboot_cmd = "systemctl reboot"
logout_cmd = "niri msg action quit"
remove_airplane_btn = true
remove_idle_btn = true
indicators = [
  "Battery",
  "Network",
  "Bluetooth",
  "Audio",
  "Microphone",
  "PowerProfile",
  "Vpn",
  "Brightness",
]

[[settings.CustomButton]]
name = "Activity"
icon = "󰾆"
command = "wezterm-gui start -- btop"
tooltip = "Open btop"

[[settings.CustomButton]]
name = "Mixer"
icon = "󰕾"
command = "pavucontrol"
tooltip = "Open audio mixer"

[appearance]
style = "Islands"
opacity = 1.0
scale_factor = 1.0
font_name = "Noto Sans"
success_color = "#9AD7A0"
warning_color = "#E6C177"
text_color = "#D7DEE8"
workspace_colors = [ "#D7E3FF" ]
special_workspace_colors = [ "#D7E3FF" ]

[appearance.primary_color]
base = "#D7E3FF"
weak = "#9FB3D8"
strong = "#F1F6FF"
text = "#090B0F"

[appearance.danger_color]
base = "#FF7A90"
weak = "#FFB4A2"
strong = "#FF5F7C"
text = "#13070A"

[appearance.background_color]
base = "#0B0D10"
weakest = "#080A0D"
weaker = "#0D1014"
weak = "#141820"
neutral = "#1A2028"
strong = "#242B35"
stronger = "#303846"
strongest = "#3D4757"
text = "#D7DEE8"

[appearance.secondary_color]
base = "#11151B"
strong = "#1B222B"

[appearance.menu]
opacity = 0.94
backdrop = 0.42
