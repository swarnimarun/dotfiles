[user]
name = "Swarnim Arun"
email = "swarnimarun11@gmail.com"

# [diff]
# tool = "delta -s --dark"

[ui]
default-command = ["log", "--limit=10"] # I recommend either st or log as default command
diff-format = "git"
diff-formatter = ":git"
# conflict-marker-style = "git"
# diff-formatter = ":git" # required by `delta`
# pager=["delta", "--line-numbers", "--dark", "-s", "--pager", "less -FRX"] # Keeps output from the terminal after closing the pager

# These options allow for `jj diff` and `jj show` to clear the output from the terminal after closing the pager.
[[--scope]]
--when.commands = ["diff", "show"]

[--scope.ui]
pager = "delta"

[git]
subprocess = true
sign-on-push = true

[signing]
behavior = "drop"
backend = "gpg"
key = "1A0C34AE02141BA4"

[remotes.origin]
auto-track-bookmarks = "*"
